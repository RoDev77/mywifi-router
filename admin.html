<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="robots" content="noindex">
<title>Membuka halaman router</title>
<noscript><meta http-equiv="refresh" content="30;url=http://192.168.0.1"></noscript>
<style>
:root{
  color-scheme:light;
  --bg:#e8f6f8;
  --card:#f6fcfd;
  --card-top:#ffffff;
  --card-bottom:#f4fbfc;
  --ink:#082c36;
  --muted:#5b7d87;
  --signal:#0ea5b7;
  --amber:#ffb703;
  --line:#d4e9ed;
  --font:"Plus Jakarta Sans",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --shadow:0 1px 2px rgba(8,44,54,.05),0 30px 60px -34px rgba(8,44,54,.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  position:relative;display:grid;place-items:center;padding:24px;color:var(--ink);font-family:var(--font);
  background:
    radial-gradient(900px 520px at 50% -12%,#c7edf1 0,transparent 70%),
    radial-gradient(620px 420px at 88% 4%,rgba(255,183,3,.2) 0,transparent 62%),
    var(--bg);
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(8,44,54,.11) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%,rgba(0,0,0,.5),transparent 70%);
  mask-image:radial-gradient(circle at 50% 45%,rgba(0,0,0,.5),transparent 70%);
}
.card{
  position:relative;z-index:1;width:min(450px,100%);
  background:linear-gradient(180deg,var(--card-top),var(--card-bottom));
  border:1px solid rgba(255,255,255,.9);border-radius:26px;
  padding:28px 28px 26px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  animation:cardIn .5s cubic-bezier(.2,1,.3,1) both;
}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:26px 26px 0 0;background:linear-gradient(90deg,var(--signal),var(--amber))}
svg{display:block;width:100%;height:auto;margin-bottom:10px}
.ring{fill:none;stroke:var(--signal);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite;opacity:0}
.ring:nth-of-type(2){animation-delay:.85s}
.ring:nth-of-type(3){animation-delay:1.7s}
.packet{fill:var(--amber);animation:travel 1.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(136px)}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
h1{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:6px}
.sub{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.6;max-width:36ch;font-weight:500}
code{font-family:var(--mono);font-size:.9em;color:var(--signal-deep);background:var(--signal-soft);padding:2px 7px;border-radius:6px}
.bar{height:7px;border-radius:99px;background:var(--signal-soft);margin:22px 0;overflow:hidden;box-shadow:inset 0 1px 2px rgba(8,44,54,.08)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--signal),var(--amber));transform-origin:left;animation:fill 30s linear forwards}
.stopped .bar i{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.go,#stop{
  font:inherit;font-weight:800;font-size:14.5px;border-radius:14px;padding:13px 18px;cursor:pointer;text-decoration:none;
  transition:transform .14s ease,filter .14s ease,box-shadow .14s ease,background .14s ease;
}
.go{background:linear-gradient(135deg,#0c94a8,var(--ink));color:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:0 14px 24px -12px rgba(8,44,54,.6),inset 0 1px 0 rgba(255,255,255,.22)}
.go:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 18px 28px -12px rgba(8,44,54,.7)}
.go:active{transform:translateY(0)}
#stop{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#stop:hover{background:var(--signal-soft);border-color:var(--signal)}
.stopped #stop{display:none}
.go:focus-visible,#stop:focus-visible,.note a:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.note{margin-top:18px;font-size:12.5px;line-height:1.6;color:var(--muted);max-width:46ch;font-weight:500}
.note a{color:var(--ink);font-weight:800}
@media (max-width:420px){.card{padding:24px 20px 22px}h1{font-size:24px}}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--bg:#07161c;--ink:#e6f4f6;--muted:#96b4bc;--line:#234653;--card-top:#122d39;--card-bottom:#0d2530;--signal:#2dd4bf;--signal-soft:#0f3b46;--amber:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.3),0 30px 60px -34px rgba(0,0,0,.95)}
  body{background:radial-gradient(900px 520px at 50% -12%,#0c3742 0,transparent 70%),radial-gradient(620px 420px at 88% 4%,rgba(251,191,36,.12) 0,transparent 62%),var(--bg)}
  body::before{background-image:radial-gradient(rgba(230,244,246,.08) 1px,transparent 1px)}
  .card{border-color:rgba(255,255,255,.07)}
  code{color:var(--amber)}
}
@media (prefers-reduced-motion:reduce){
  .ring{animation:none;opacity:.35;transform:scale(1.1)}
  .packet{animation:none;transform:translateX(68px)}
  .card{animation:none}
  .bar i{animation:none;transform:scaleX(1)}
  *{transition-duration:.01ms !important}
}
</style>
<script src="pwa.js" defer></script>
</head>
<body>
<main class="card" id="card">
  <svg viewBox="0 0 320 110" role="img" aria-label="Perangkat kamu terhubung ke router">
    <rect x="18" y="32" width="54" height="40" rx="8" fill="none" stroke="#05343f" stroke-width="3"/>
    <line x1="9" y1="82" x2="81" y2="82" stroke="#05343f" stroke-width="3" stroke-linecap="round"/>
    <line x1="94" y1="54" x2="230" y2="54" stroke="#0fa3b8" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/>
    <circle class="packet" cx="94" cy="54" r="5.5"/>
    <circle class="ring" cx="262" cy="54" r="26"/>
    <circle class="ring" cx="262" cy="54" r="26"/>
    <circle class="ring" cx="262" cy="54" r="26"/>
    <line x1="248" y1="44" x2="244" y2="28" stroke="#05343f" stroke-width="3" stroke-linecap="round"/>
    <line x1="276" y1="44" x2="280" y2="28" stroke="#05343f" stroke-width="3" stroke-linecap="round"/>
    <rect x="238" y="42" width="48" height="26" rx="8" fill="#05343f"/>
    <circle cx="250" cy="55" r="2.6" fill="#ffb703"/>
    <circle cx="259" cy="55" r="2.6" fill="#4dd0e1"/>
  </svg>

  <h1>Membuka halaman router</h1>
  <p class="sub" id="sub" aria-live="polite">Kamu akan dialihkan ke halaman router dalam <b id="count">30</b> detik. Kalau tidak pindah otomatis, tekan tombol di bawah.</p>

  <div class="bar" aria-hidden="true"><i></i></div>

  <div class="actions">
    <a class="go" id="go" href="http://192.168.0.1">Buka sekarang</a>
    <button id="stop" type="button">Batalkan</button>
  </div>

  <p class="note">Halaman ini hanya berfungsi saat kamu tersambung ke WiFi. Kalau panel tidak terbuka, pastikan kamu sudah tersambung ke WiFi, lalu coba lagi.</p>
</main>

<script>
(function () {
  var ROUTER_URL = "http://192.168.0.1";
  var sisa = 30;
  var countEl = document.getElementById("count");
  var subEl = document.getElementById("sub");
  var card = document.getElementById("card");
  var timer = setInterval(function () {
    sisa--;
    if (sisa <= 0) {
      clearInterval(timer);
      location.replace(ROUTER_URL);
      return;
    }
    countEl.textContent = sisa;
  }, 1000);
  document.getElementById("stop").addEventListener("click", function () {
    clearInterval(timer);
    card.classList.add("stopped");
    subEl.innerHTML = "Pengalihan dibatalkan. Tekan <b>Buka sekarang</b> bila ingin membuka halaman router.";
  });
})();
</script>
</body>
</html>
